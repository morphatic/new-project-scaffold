version: 2

# Keep dependencies fresh without manual chasing.
# Patch updates are auto-merged by .github/workflows/dependabot-auto-merge.yml
# once CI passes. Minor/major updates open PRs for human review.

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci
      include: scope
    labels:
      - dependencies
      - github-actions

  # Uncomment the ecosystem block that matches your stack. Delete the rest.
